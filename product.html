<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محصول | AViStore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .header {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: #111;
        }

        .logo span {
            color: #f5a400;
        }

        .cart {
            background: #111;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .product {
            background: white;
            border-radius: 20px;
            padding: 25px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .product img {
            width: 100%;
            border-radius: 18px;
        }

        h1 {
            font-size: 32px;
        }

        .description {
            color: #666;
            line-height: 2;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            margin-top: 25px;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            margin-top: 8px;
        }

        .stock {
            margin-top: 15px;
            color: #555;
        }

        button {
            width: 100%;
            border: none;
            background: #f5a400;
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .loading,
        .error {
            background: white;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .product {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header">

        <a href="index.html" class="logo">
            AVi<span>Store</span>
        </a>

        <a href="checkout.html" class="cart">
            🛒 سبد خرید
        </a>

    </div>

</header>

<main>

    <div id="product">

        <div class="loading">
            در حال دریافت محصول...
        </div>

    </div>

</main>


<script>

const API_BASE = "https://api.avistore.ir";

const CART_KEY = "avistore_cart";


function formatPrice(price) {

    return Number(price).toLocaleString("fa-IR") + " تومان";

}


function getProductId() {

    const params =
        new URLSearchParams(window.location.search);

    return params.get("id");

}


async function loadProduct() {

    const container =
        document.getElementById("product");

    const id =
        getProductId();


    if (!id) {

        container.innerHTML = `
            <div class="error">
                شناسه محصول وجود ندارد.
            </div>
        `;

        return;

    }


    try {

        const response =
            await fetch(
                API_BASE +
                "/products/" +
                encodeURIComponent(id)
            );


        const data =
            await response.json();


        console.log("API:", data);


        if (!data.ok || !data.product) {

            throw new Error(
                "محصول پیدا نشد"
            );

        }


        const product =
            data.product;


        document.title =
            product.name + " | AViStore";


        container.innerHTML = `

            <div class="product">

                <div>

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                </div>


                <div>

                    <h1>
                        ${product.name}
                    </h1>


                    <p class="description">
                        ${product.description || ""}
                    </p>


                    <div class="price">

                        ${formatPrice(
                            product.price
                        )}

                    </div>


                    ${
                        product.old_price
                        ?
                        `
                        <div class="old-price">

                            ${formatPrice(
                                product.old_price
                            )}

                        </div>
                        `
                        :
                        ""
                    }


                    <div class="stock">

                        موجودی:
                        ${product.stock}

                    </div>


                    <button
                        onclick="addToCart(
                            ${product.id},
                            '${String(product.name).replace(/'/g, "\\'")}',
                            ${Number(product.price)},
                            '${String(product.image).replace(/'/g, "\\'")}'
                        )"
                    >

                        افزودن به سبد خرید 🛒

                    </button>

                </div>

            </div>

        `;


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                ❌ خطا در دریافت محصول

                <br><br>

                <a href="index.html">
                    بازگشت به فروشگاه
                </a>

            </div>

        `;

    }

}


function addToCart(
    id,
    name,
    price,
    image
) {

    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    CART_KEY
                )
            ) || [];

    } catch {

        cart = [];

    }


    const existing =
        cart.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (existing) {

        existing.quantity =
            Number(existing.quantity) + 1;

    } else {

        cart.push({

            id: Number(id),

            name: name,

            price: Number(price),

            image: image,

            quantity: 1

        });

    }


    localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
    );


    window.location.href =
        "checkout.html";

}


document.addEventListener(
    "DOMContentLoaded",
    loadProduct
);

</script>

</body>
</html>
