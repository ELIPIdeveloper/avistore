<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سبد خرید | اوی‌استور</title>
<meta name="description" content="فروشگاه اینترنتی اوی‌استور — خرید امن و سریع">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F6E5D'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23FAF9F5' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<style>

  :root{
    --bg:#F5F7F4;
    --surface:#FFFFFF;
    --ink:#16211C;
    --ink-soft:#5B6960;
    --ink-faint:#8B9790;
    --accent:#0F6E5D;
    --accent-dark:#0B4F42;
    --accent-tint:#E4F0EC;
    --gold:#D98E2B;
    --gold-tint:#FBEED9;
    --danger:#C2452F;
    --danger-tint:#FBE7E2;
    --line:#E1E6DF;
    --radius:16px;
    --shadow:0 8px 28px -12px rgba(22,33,28,.18);
    --shadow-lg:0 20px 60px -20px rgba(22,33,28,.35);
    --header-h:64px;
    --nav-h:64px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  a{color:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  /* ===== Top bar ===== */
  header.site-head{
    position:sticky;top:0;z-index:40;
    background:rgba(245,247,244,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{
    max-width:1200px;margin:0 auto;padding:12px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{
    display:flex;align-items:center;gap:8px;
    font-weight:900;font-size:19px;letter-spacing:-.3px;
    flex-shrink:0;
    text-decoration:none;color:var(--ink);
    background:none;border:none;padding:0;
  }
  .brand-mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;flex-shrink:0;
  }
  .search-wrap{flex:1;position:relative;max-width:520px;}
  .search-wrap input{
    width:100%;padding:10px 40px 10px 14px;
    border-radius:999px;border:1.5px solid var(--line);
    background:var(--surface);font-size:14px;color:var(--ink);
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-tint);}
  .search-wrap svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;}
  .icon-btn{
    position:relative;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:#fff;border:none;
    width:40px;height:40px;border-radius:999px;
    transition:transform .12s;
  }
  .icon-btn:active{transform:scale(.94);}
  .cart-badge{
    position:absolute;top:-4px;left:-4px;
    background:var(--gold);color:#241505;
    font-size:10.5px;font-weight:800;
    min-width:18px;height:18px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    padding:0 4px;border:2px solid var(--bg);
  }

  /* ===== App shell / pages ===== */
  .app{max-width:1200px;margin:0 auto;padding:0 0 calc(var(--nav-h) + 24px);}
  .page{display:none;}
  .page.active{display:block;}

  /* ===== Home: hero / banners ===== */
  .banner-slider{
    padding:16px 16px 4px;
  }
  .banner-track{
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;padding-bottom:4px;
    scrollbar-width:none;
  }
  .banner-track::-webkit-scrollbar{display:none;}
  .banner-slide{
    scroll-snap-align:start;flex:0 0 100%;min-width:100%;
    border-radius:18px;overflow:hidden;position:relative;
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
    color:#fff;padding:26px 22px;min-height:132px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
  }
  .banner-slide.alt{background:linear-gradient(135deg,#3A3226 0%,var(--ink) 100%);}
  .banner-slide.gold{background:linear-gradient(135deg,var(--gold) 0%,#B36F16 100%);}
  .banner-eyebrow{font-size:12px;font-weight:700;opacity:.85;}
  .banner-slide h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.3px;}
  .banner-slide p{margin:0;font-size:13px;opacity:.9;line-height:1.7;max-width:360px;}
  .banner-dots{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  .banner-dots span{width:6px;height:6px;border-radius:999px;background:var(--line);transition:background .2s,width .2s;}
  .banner-dots span.on{background:var(--accent);width:16px;}

  .about-section{
    margin:22px 16px 4px;padding:20px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);
  }
  .about-section h3{margin:0 0 8px;font-size:16px;font-weight:800;}
  .about-section p{margin:0 0 8px;color:var(--ink-soft);font-size:13.5px;line-height:1.9;}
  .about-section p:last-child{margin-bottom:0;}
  .trust-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .trust-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--accent-tint);color:var(--accent-dark);
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;
  }

  .section-title{
    display:flex;align-items:center;justify-content:space-between;
    margin:24px 16px 12px;
  }
  .section-title h2{font-size:16.5px;font-weight:800;margin:0;}
  .section-title span{color:var(--ink-faint);font-size:12.5px;}
  .refresh-link{background:none;border:none;color:var(--accent);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:4px;padding:0;}

  /* ===== Product grid (shared: home + search) ===== */
  .grid{
    display:grid;gap:14px;padding:0 16px;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
    transition:box-shadow .2s, transform .2s;
  }
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .card-media{
    aspect-ratio:1/1;background:var(--accent-tint);position:relative;cursor:zoom-in;
    overflow:hidden;
  }
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
  .card:hover .card-media img{transform:scale(1.05);}
  .card-media .zoom-hint{
    position:absolute;bottom:8px;left:8px;
    background:rgba(22,33,28,.65);color:#fff;font-size:10.5px;
    padding:3px 8px;border-radius:999px;opacity:0;transition:opacity .2s;
  }
  .card:hover .zoom-hint{opacity:1;}
  .card-body{padding:11px 11px 13px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .card-title{font-size:13.5px;font-weight:700;line-height:1.4;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-desc{
    font-size:12px;color:var(--ink-soft);line-height:1.7;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:4px;flex-wrap:wrap;}
  .price-tag{font-weight:800;font-size:13px;color:var(--accent-dark);white-space:nowrap;}
  .add-btn{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:7px 12px;font-size:12px;font-weight:700;flex-shrink:0;
    transition:background .15s, transform .12s;
  }
  .add-btn:hover{background:var(--accent-dark);}
  .add-btn:active{transform:scale(.95);}
  .add-btn:disabled{background:var(--ink-faint);cursor:not-allowed;}

  .empty-state, .error-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);grid-column:1/-1;
  }
  .empty-state h3, .error-state h3{margin:0 0 6px;font-size:16px;color:var(--ink);}
  .empty-state p, .error-state p{font-size:13px;margin:0;}
  .skeleton{
    background:linear-gradient(100deg,var(--surface) 30%,#eef1ec 50%,var(--surface) 70%);
    background-size:200% 100%;animation:shine 1.3s infinite;
    border-radius:var(--radius);aspect-ratio:.78;
  }
  @keyframes shine{to{background-position:-200% 0;}}

  /* ===== Search page ===== */
  .search-page-head{padding:16px 16px 4px;}
  .search-page-head .search-wrap{max-width:none;}
  .search-page-head input{padding:13px 44px 13px 16px;font-size:15px;}
  .search-meta{padding:12px 16px;color:var(--ink-faint);font-size:12.5px;}

  /* ===== Cart page ===== */
  .cart-page-inner{padding:16px;}
  .cart-page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .cart-page-head h2{font-size:17px;font-weight:800;margin:0;}
  .cart-item{
    display:flex;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line);
    background:var(--surface);
  }
  .cart-item img{width:56px;height:56px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-info h4{margin:0 0 4px;font-size:13.5px;font-weight:700;}
  .cart-item-info .line-price{font-size:12.5px;color:var(--ink-faint);}
  .cart-item-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .remove-link{background:none;border:none;color:var(--danger);font-size:11.5px;text-decoration:underline;padding:0;}
  .cart-empty{text-align:center;padding:70px 10px;color:var(--ink-faint);}
  .cart-empty svg{opacity:.35;margin-bottom:10px;}
  .cart-list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;}

  .stepper{
    display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .stepper button{
    width:30px;height:30px;background:var(--surface);border:none;font-size:16px;font-weight:700;color:var(--ink);
  }
  .stepper button:hover{background:var(--accent-tint);}
  .stepper span{width:32px;text-align:center;font-weight:700;font-size:14px;}

  .receipt-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-top:16px;
  }
  .receipt-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);padding:3px 0;}
  .receipt-total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;padding-top:8px;margin-top:6px;border-top:1.5px dashed var(--line);}
  .checkout-btn{
    width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:13px;font-size:15px;font-weight:800;margin-top:14px;
    transition:background .15s;
  }
  .checkout-btn:hover{background:var(--accent-dark);}
  .checkout-btn:disabled{background:var(--ink-faint);cursor:not-allowed;}
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;padding:0;margin-bottom:14px;}

  /* checkout form */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
    font-size:14px;background:var(--bg);color:var(--ink);outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);background:var(--surface);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-error{
    background:var(--danger-tint);color:var(--danger);font-size:12.5px;font-weight:600;
    padding:9px 12px;border-radius:9px;margin-bottom:12px;display:none;
  }
  .form-error.show{display:block;}
  .checkout-form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}

  /* ===== Lightbox ===== */
  .lightbox{
    position:fixed;inset:0;background:rgba(16,20,17,.72);
    display:none;align-items:center;justify-content:center;z-index:80;padding:20px;
  }
  .lightbox.open{display:flex;}
  .lightbox-panel{
    background:var(--surface);border-radius:20px;max-width:820px;width:100%;
    max-height:88vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;
    box-shadow:var(--shadow-lg);position:relative;
  }
  @media (max-width:680px){.lightbox-panel{grid-template-columns:1fr;}}
  .lightbox-img{background:var(--accent-tint);}
  .lightbox-img img{width:100%;height:100%;object-fit:cover;max-height:420px;}
  .lightbox-info{padding:24px;display:flex;flex-direction:column;gap:12px;}
  .lightbox-info h2{margin:0;font-size:20px;font-weight:800;}
  .lightbox-info p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.9;}
  .lightbox-close{
    position:absolute;top:12px;left:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;z-index:2;
  }

  /* ===== Bottom nav ===== */
  nav.bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;align-items:stretch;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;color:var(--ink-faint);padding:9px 4px 8px;
    font-size:11px;font-weight:700;position:relative;
  }
  .nav-btn svg{width:22px;height:22px;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn .nav-badge{
    position:absolute;top:2px;left:calc(50% + 4px);
    background:var(--gold);color:#241505;
    font-size:10px;font-weight:800;
    min-width:16px;height:16px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* toast */
  .toast-stack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
    animation:toast-in .25s ease;
  }
  .toast.err{background:var(--danger);}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  footer.app-foot{padding:20px 16px 8px;text-align:center;color:var(--ink-faint);font-size:12px;}


  .head-inner{justify-content:space-between;}

</style>
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">A</span><span class="brand-text">اوی‌استور</span>
    </a>
    <a class="icon-btn" href="cart.html" aria-label="سبد خرید">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span class="cart-badge" id="cartBadge" hidden>0</span>
    </a>
  </div>
</header>

<div class="app">
  <section>
    <div class="cart-page-inner">

      <div id="cartView">
        <div class="cart-page-head">
          <h2>سبد خرید</h2>
        </div>
        <div class="cart-list-card" id="cartItemsWrap"></div>
        <div class="receipt-card" id="cartFoot" hidden>
          <div class="receipt-row"><span>تعداد اقلام</span><span class="num" id="cartItemCount">0</span></div>
          <div class="receipt-total"><span>جمع کل</span><span class="num" id="cartSubtotal">0 ریال</span></div>
          <p style="font-size:11px;color:var(--ink-faint);margin:6px 0 0;line-height:1.7;">مبلغ نهایی هنگام پرداخت توسط سرور مجدداً محاسبه می‌شود.</p>
          <button class="checkout-btn" id="goCheckoutBtn">ادامه و تکمیل سفارش</button>
        </div>
      </div>

      <div id="checkoutView" style="display:none;">
        <button class="back-link" id="backToCartBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
          بازگشت به سبد
        </button>
        <div class="cart-page-head"><h2>تکمیل اطلاعات ارسال</h2></div>
        <div class="checkout-form-card">
          <div class="form-error" id="formError"></div>
          <form id="checkoutForm">
            <div class="field"><label>نام و نام خانوادگی</label><input type="text" name="full_name" required maxlength="100"></div>
            <div class="field"><label>شماره موبایل</label><input type="tel" name="phone" required placeholder="09xxxxxxxxx" maxlength="11" inputmode="numeric"></div>
            <div class="field-row">
              <div class="field"><label>استان</label><input type="text" name="province" required maxlength="50"></div>
              <div class="field"><label>شهر</label><input type="text" name="city" required maxlength="80"></div>
            </div>
            <div class="field"><label>آدرس کامل</label><textarea name="address" required maxlength="500"></textarea></div>
            <div class="field"><label>کد پستی</label><input type="text" name="postal_code" required maxlength="20" inputmode="numeric"></div>
            <div class="field"><label>توضیحات (اختیاری)</label><textarea name="notes" maxlength="500"></textarea></div>
          </form>
        </div>
        <div class="receipt-card">
          <div class="receipt-total"><span>مبلغ قابل پرداخت</span><span class="num" id="checkoutTotal">0 ریال</span></div>
          <button class="checkout-btn" id="payBtn" type="submit" form="checkoutForm">پرداخت و ثبت سفارش</button>
        </div>
      </div>

    </div>
  </section>
</div>

<footer class="app-foot">© <span id="year"></span> اوی‌استور — تمام حقوق محفوظ است.</footer>
<div class="toast-stack" id="toastStack"></div>
<nav class="bottom-nav">
  <a class="nav-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    خانه
  </a>
  <a class="nav-btn" href="category.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    دسته‌بندی
  </a>
  <a class="nav-btn" href="search.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    جستجو
  </a>
  <a class="nav-btn active" href="cart.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
    سبد خرید
    <span class="nav-badge" id="navCartBadge" hidden>0</span>
  </a>
</nav>

<script>
(function(){

  "use strict";
  var CONFIG = {
    API_BASE: "",
    PRODUCTS_URL: "/products.json",
    MAX_QTY_PER_PRODUCT: 10,
    CURRENCY_LABEL: "ریال",
    HOME_RANDOM_COUNT: 8
  };
  var STORAGE = { CART: "avistore_cart", CUSTOMER: "avistore_customer" };

  var products = [];
  var productsByCode = {};
  var cart = {};

  document.getElementById("year").textContent = new Date().getFullYear();

  function loadCart(){
    try {
      var raw = localStorage.getItem(STORAGE.CART);
      if(!raw) return {};
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === "object") ? parsed : {};
    } catch(e){ 
      console.warn("Failed to load cart:", e);
      return {}; 
    }
  }
  function saveCart(){
    try { 
      localStorage.setItem(STORAGE.CART, JSON.stringify(cart));
      console.log("Cart saved:", cart);
    } catch(e){
      console.error("Failed to save cart:", e);
    }
  }
  
  // تحميل السبد عند بدء الصفحة
  cart = loadCart();
  function loadCustomer(){
    try {
      var raw = localStorage.getItem(STORAGE.CUSTOMER);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }
  function saveCustomer(data){
    try { localStorage.setItem(STORAGE.CUSTOMER, JSON.stringify(data)); } catch(e){}
  }

  function fmtPrice(n){
    n = Number(n) || 0;
    return n.toLocaleString("fa-IR") + " " + CONFIG.CURRENCY_LABEL;
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg, isErr){
    var stack = document.getElementById("toastStack");
    var el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function(){
      el.style.transition = "opacity .3s"; el.style.opacity = "0";
      setTimeout(function(){ el.remove(); }, 300);
    }, 2200);
  }
  function shuffledCopy(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function updateCartBadge(){
    var count = 0;
    Object.keys(cart).forEach(function(code){
      if(cart[code] > 0) count += cart[code];
    });
    var badge = document.getElementById("cartBadge");
    var navBadge = document.getElementById("navCartBadge");
    if(count > 0){
      if(badge){ badge.hidden = false; badge.textContent = count; }
      if(navBadge){ navBadge.hidden = false; navBadge.textContent = count; }
    } else {
      if(badge) badge.hidden = true;
      if(navBadge) navBadge.hidden = true;
    }
  }
  updateCartBadge();

  function cardHtml(p){
    var thumb = escapeHtml(p.thumb || p.image || "");
    var qtyInCart = cart[p.code] || 0;
    var atMax = qtyInCart >= CONFIG.MAX_QTY_PER_PRODUCT;
    return (
      '<div class="card" data-code="' + escapeHtml(p.code) + '">' +
        '<div class="card-media" data-open-lightbox="' + escapeHtml(p.code) + '">' +
          '<img src="' + thumb + '" alt="' + escapeHtml(p.name) + '" loading="lazy">' +
          '<span class="zoom-hint">نمایش تصویر</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<h3 class="card-title">' + escapeHtml(p.name) + '</h3>' +
          '<p class="card-desc">' + escapeHtml(p.description || "") + '</p>' +
          '<div class="card-foot">' +
            '<span class="price-tag num">' + fmtPrice(p.price) + '</span>' +
            '<button class="add-btn" data-add="' + escapeHtml(p.code) + '" ' + (atMax ? "disabled" : "") + '>' +
              (atMax ? "حداکثر" : "افزودن") +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function addToCart(code, qty){
    var product = productsByCode[code];
    if(!product) return;
    var current = cart[code] || 0;
    var next = Math.min(current + qty, CONFIG.MAX_QTY_PER_PRODUCT);
    if(next === current){
      toast("حداکثر " + CONFIG.MAX_QTY_PER_PRODUCT + " عدد از این محصول قابل افزودن است.", true);
      return;
    }
    cart[code] = next;
    saveCart();
    updateCartBadge();
    if(typeof afterCartChange === "function") afterCartChange();
    toast(product.name + " به سبد اضافه شد.");
  }

  function loadProducts(){
    fetch(CONFIG.PRODUCTS_URL, { cache: "no-store" })
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(list){
        if(!Array.isArray(list)) throw new Error("فرمت products.json نامعتبر است.");
        products = list.filter(function(p){ return p && p.code && p.active !== false; });
        productsByCode = {};
        products.forEach(function(p){ productsByCode[p.code] = p; });
        renderCart();
      })
      .catch(function(err){
        console.error("Error loading products:", err);
        // عرض السبد حتى إذا فشل تحميل المنتجات
        renderCart();
      });
  }

  // تصحيح اختبار: اطبع محتويات السبد الحالي
  console.log("Initial cart data:", cart);
  console.log("Storage key:", STORAGE.CART);
  console.log("LocalStorage value:", localStorage.getItem(STORAGE.CART));
  
  // عرض السبد فور التحميل (حتى قبل تحميل المنتجات)
  renderCart();
  
  document.getElementById("cartItemsWrap").addEventListener("click", function(e){
    var inc = e.target.closest("[data-inc]");
    var dec = e.target.closest("[data-dec]");
    var rem = e.target.closest("[data-remove]");
    if(inc) setQty(inc.getAttribute("data-inc"), (cart[inc.getAttribute("data-inc")]||0) + 1);
    if(dec) setQty(dec.getAttribute("data-dec"), (cart[dec.getAttribute("data-dec")]||0) - 1);
    if(rem) setQty(rem.getAttribute("data-remove"), 0);
  });

  function setQty(code, qty){
    if(qty <= 0){ delete cart[code]; }
    else { cart[code] = Math.min(qty, CONFIG.MAX_QTY_PER_PRODUCT); }
    saveCart();
    updateCartBadge();
    renderCart();
  }

  function cartEntries(){
    return Object.keys(cart)
      .filter(function(code){ return cart[code] > 0; })
      .map(function(code){ 
        return { 
          code: code, 
          qty: cart[code], 
          product: productsByCode[code] || { 
            name: "منتج حذف شده",
            price: 0,
            thumb: "",
            image: ""
          }
        }; 
      });
  }

  function cartTotal(){
    return cartEntries().reduce(function(sum, e){ return sum + (Number(e.product.price)||0) * e.qty; }, 0);
  }

  function renderCart(){
    var entries = cartEntries();
    var count = entries.reduce(function(s,e){ return s + e.qty; }, 0);
    updateCartBadge();

    var wrap = document.getElementById("cartItemsWrap");
    var foot = document.getElementById("cartFoot");

    if(!entries.length){
      wrap.innerHTML =
        '<div class="cart-empty">' +
        '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/></svg>' +
        '<p>سبد خرید شما خالی است</p></div>';
      foot.hidden = true;
      updateCheckoutTotal();
      return;
    }

    foot.hidden = false;
    wrap.innerHTML = entries.map(function(e){
      var thumb = escapeHtml(e.product.thumb || e.product.image || "");
      return (
        '<div class="cart-item" data-code="' + escapeHtml(e.code) + '">' +
          '<img src="' + thumb + '" alt="">' +
          '<div class="cart-item-info">' +
            '<h4>' + escapeHtml(e.product.name) + '</h4>' +
            '<div class="line-price num">' + fmtPrice(e.product.price) + ' × ' + e.qty + '</div>' +
            '<div class="stepper" style="margin-top:6px;">' +
              '<button type="button" data-dec="' + escapeHtml(e.code) + '">−</button>' +
              '<span class="num">' + e.qty + '</span>' +
              '<button type="button" data-inc="' + escapeHtml(e.code) + '" ' + (e.qty>=CONFIG.MAX_QTY_PER_PRODUCT?"disabled":"") + '>+</button>' +
            '</div>' +
          '</div>' +
          '<div class="cart-item-actions">' +
            '<span class="num" style="font-weight:700;font-size:13px;">' + fmtPrice(e.product.price * e.qty) + '</span>' +
            '<button class="remove-link" data-remove="' + escapeHtml(e.code) + '">حذف</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    document.getElementById("cartItemCount").textContent = count;
    document.getElementById("cartSubtotal").textContent = fmtPrice(cartTotal());
    updateCheckoutTotal();
  }

  function updateCheckoutTotal(){
    var el = document.getElementById("checkoutTotal");
    if(el) el.textContent = fmtPrice(cartTotal());
  }

  var cartView = document.getElementById("cartView");
  var checkoutView = document.getElementById("checkoutView");

  function showCartView(){ cartView.style.display = "block"; checkoutView.style.display = "none"; }
  function showCheckoutView(){
    if(!cartEntries().length){ toast("سبد خرید خالی است.", true); return; }
    cartView.style.display = "none"; checkoutView.style.display = "block";
    prefillCustomer();
  }

  document.getElementById("goCheckoutBtn").addEventListener("click", showCheckoutView);
  document.getElementById("backToCartBtn").addEventListener("click", showCartView);

  var form = document.getElementById("checkoutForm");
  var payBtn = document.getElementById("payBtn");
  var formError = document.getElementById("formError");

  function prefillCustomer(){
    var saved = loadCustomer();
    Object.keys(saved).forEach(function(key){
      var input = form.querySelector('[name="' + key + '"]');
      if(input) input.value = saved[key];
    });
  }
  function showFormError(msg){
    formError.textContent = msg;
    formError.classList.add("show");
  }
  function hideFormError(){ formError.classList.remove("show"); }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    hideFormError();

    var entries = cartEntries();
    if(!entries.length){ showFormError("سبد خرید خالی است."); return; }

    var fd = new FormData(form);
    var customer = {
      full_name: (fd.get("full_name")||"").toString().trim(),
      phone: (fd.get("phone")||"").toString().trim(),
      province: (fd.get("province")||"").toString().trim(),
      city: (fd.get("city")||"").toString().trim(),
      address: (fd.get("address")||"").toString().trim(),
      postal_code: (fd.get("postal_code")||"").toString().trim(),
      notes: (fd.get("notes")||"").toString().trim()
    };

    if(!customer.full_name){ showFormError("نام و نام خانوادگی را وارد کنید."); return; }
    if(!/^09\d{9}$/.test(customer.phone)){ showFormError("شماره موبایل معتبر نیست (مثال: 09123456789)."); return; }
    if(!customer.province || !customer.city || !customer.address || !customer.postal_code){
      showFormError("اطلاعات آدرس را کامل وارد کنید."); return;
    }

    saveCustomer(customer);

    var products_payload = entries.map(function(e){
      return { code: e.code, quantity: e.qty };
    });

    payBtn.disabled = true;
    payBtn.textContent = "در حال اتصال به درگاه…";

    fetch(CONFIG.API_BASE + "/api/create-payment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ products: products_payload, customer: customer })
    })
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if(res.ok && res.data && res.data.ok && res.data.url){
          window.location.href = res.data.url;
        } else {
          var msg = (res.data && res.data.error) ? res.data.error : "ثبت سفارش با خطا مواجه شد.";
          showFormError(msg);
          payBtn.disabled = false;
          payBtn.textContent = "پرداخت و ثبت سفارش";
        }
      })
      .catch(function(){
        showFormError("ارتباط با سرور برقرار نشد. اتصال اینترنت را بررسی کنید.");
        payBtn.disabled = false;
        payBtn.textContent = "پرداخت و ثبت سفارش";
      });
  });

  loadProducts();

})();
</script>
</body>
</html>
