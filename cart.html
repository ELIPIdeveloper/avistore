<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سبد خرید | آوی استور</title>
<meta name="description" content="سبد خرید آوی استور؛ تکمیل سفارش و پرداخت امن با ارسال سریع به سراسر ایران.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/assets/style.css?v=5">
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="/index.html">
      <span class="brand-mark">A</span><span class="brand-text">آوی استور</span>
    </a>
    <a class="icon-btn header-search-btn" href="/search.html" aria-label="جستجو">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </a>
    <a class="icon-btn" href="/cart.html" aria-label="سبد خرید">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span class="cart-badge" hidden>0</span>
    </a>
  </div>
</header>

<div class="app">
  <div class="cart-page-inner">

    <div id="cartView">
      <div class="cart-page-head"><h2>سبد خرید</h2></div>
      <div class="cart-list-card" id="cartItemsWrap"></div>
      <div class="receipt-card" id="cartFoot" hidden>
        <div class="receipt-row"><span>تعداد اقلام</span><span class="num" id="cartItemCount">0</span></div>
        <div class="receipt-total"><span>جمع کل</span><span class="num" id="cartSubtotal">0 ریال</span></div>
        <p style="font-size:11px;color:var(--ink-faint);margin:6px 0 0;line-height:1.7;">مبلغ نهایی هنگام پرداخت توسط سرور مجدداً محاسبه می‌شود.</p>
        <button class="checkout-btn" id="goCheckoutBtn">ادامه و تکمیل سفارش</button>
      </div>
    </div>

    <div id="checkoutView" style="display:none;">
      <button class="back-link" id="backToCartBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
        بازگشت به سبد
      </button>
      <div class="cart-page-head"><h2>تکمیل اطلاعات ارسال</h2></div>
      <div class="checkout-form-card">
        <div class="form-error" id="formError"></div>
        <form id="checkoutForm">
          <div class="field"><label>نام و نام خانوادگی</label><input type="text" name="full_name" required maxlength="100"></div>
          <div class="field"><label>شماره موبایل</label><input type="tel" name="phone" required placeholder="09xxxxxxxxx" maxlength="11" inputmode="numeric"></div>
          <div class="field-row">
            <div class="field"><label>استان</label><input type="text" name="province" required maxlength="50"></div>
            <div class="field"><label>شهر</label><input type="text" name="city" required maxlength="80"></div>
          </div>
          <div class="field"><label>آدرس کامل</label><textarea name="address" required maxlength="500"></textarea></div>
          <div class="field"><label>کد پستی</label><input type="text" name="postal_code" required maxlength="20" inputmode="numeric"></div>
          <div class="field"><label>توضیحات (اختیاری)</label><textarea name="notes" maxlength="500"></textarea></div>
        </form>
      </div>
      <div class="receipt-card">
        <div class="receipt-total"><span>مبلغ قابل پرداخت</span><span class="num" id="checkoutTotal">0 ریال</span></div>
        <button class="checkout-btn" id="payBtn" type="submit" form="checkoutForm">پرداخت و ثبت سفارش</button>
      </div>
    </div>

    <div class="orders-section" id="ordersSection" style="display:none;">
      <div class="cart-page-head"><h2>سفارش‌های قبلی</h2></div>
      <div class="orders-list" id="ordersList"></div>
    </div>

  </div>
<div class="trust-bar">
  <div class="trust-bar-inner">
    <div class="trust-bar-brand reveal-once" tabindex="0">
      <span class="trust-bar-name">آوی استور</span>
      <span class="trust-bar-sub">پرداخت امن با زرین‌پال</span>
    </div>
    <a class="trust-bar-support reveal-once" href="tel:09010100402">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span class="num">۰۹۰۱۰۱۰۰۴۰۲</span>
    </a>
    <a class="trust-bar-enamad reveal-once" referrerpolicy="origin" target="_blank" href="https://trustseal.enamad.ir/?id=772074&amp;Code=k70qpL7avO9aMZen9F0VE9WZOzTQICoK">
      <img referrerpolicy="origin" src="https://trustseal.enamad.ir/logo.aspx?id=772074&amp;Code=k70qpL7avO9aMZen9F0VE9WZOzTQICoK" alt="نماد اعتماد الکترونیکی" style="cursor:pointer" code="k70qpL7avO9aMZen9F0VE9WZOzTQICoK">
    </a>
  </div>
</div>

</div>

<footer class="app-foot">© <span id="year"></span> آوی استور — تمام حقوق محفوظ است.</footer>

    خانه

  <a class="nav-btn" href="/categories.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    دسته‌ها
  </a>
  <a class="nav-btn" href="/search.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    جستجو
  </a>
  <a class="nav-btn active" href="/cart.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
    سبد خرید
    <span class="nav-badge" hidden>0</span>

</body>
</html>
