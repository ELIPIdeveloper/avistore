<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>جستجو | اوی‌استور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F4E86'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23FAF9F5' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="/index.html">
      <span class="brand-mark">A</span><span class="brand-text">اوی‌استور</span>
    </a>
    <a class="icon-btn header-search-btn" href="/search.html" aria-label="جستجو">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </a>
    <a class="icon-btn" href="/cart.html" aria-label="سبد خرید">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span class="cart-badge" hidden>0</span>
    </a>
  </div>
</header>

<div class="search-page-head" id="searchPageHead">
  <div class="search-wrap">
    <input id="searchInputPage" type="text" placeholder="دنبال چی می‌گردی؟" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>
</div>
<div class="app">
  <div class="search-meta" id="searchMeta"></div>
  <div class="grid" id="searchGrid"></div>
</div>

<footer class="app-foot">© <span id="year"></span> اوی‌استور — تمام حقوق محفوظ است.</footer>

<div class="toast-stack" id="toastStack"></div>

<nav class="bottom-nav">
  <a class="nav-btn" href="/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    خانه
  </a>
  <a class="nav-btn" href="/categories.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    دسته‌ها
  </a>
  <a class="nav-btn active" href="/search.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    جستجو
  </a>
  <a class="nav-btn" href="/cart.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
    سبد خرید
    <span class="nav-badge" hidden>0</span>
  </a>
</nav>

<script src="/assets/common.js"></script>
<script>
(function(){
  "use strict";
  var A = window.AVISTORE;
  document.getElementById("year").textContent = new Date().getFullYear();
  A.initChrome();

  var grid = document.getElementById("searchGrid");
  var meta = document.getElementById("searchMeta");
  A.wireGridAddButtons(grid);

  function getQueryFromUrl(){
    var params = new URLSearchParams(window.location.search);
    return params.get("q") || "";
  }

  var searchTerm = getQueryFromUrl();
  document.getElementById("searchInputPage").value = searchTerm;

  /* قفل کردن نوار جستجو زیر هدر، طوری که هنگام اسکرول ثابت بماند */
  function pinSearchHead(){
    var header = document.querySelector("header.site-head");
    var head = document.getElementById("searchPageHead");
    if(header && head) head.style.top = header.offsetHeight + "px";
  }
  pinSearchHead();
  window.addEventListener("resize", pinSearchHead);

  function renderSearch(){
    var q = searchTerm.trim().toLowerCase();
    var all = A.getAllProducts();

    if(!q){
      meta.textContent = all.length ? "چیزی برای جستجو تایپ کن…" : "";
      grid.innerHTML = "";
      return;
    }
    var list = all.filter(function(p){
      var hay = (p.name + " " + (p.description||"")).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    meta.textContent = list.length + " نتیجه برای «" + searchTerm.trim() + "»";
    if(!list.length){
      grid.innerHTML = '<div class="empty-state"><h3>محصولی پیدا نشد</h3><p>عبارت جستجو را تغییر بده یا دوباره تلاش کن.</p></div>';
      return;
    }
    grid.innerHTML = list.map(A.cardHtml).join("");
  }
  A.onChange(renderSearch);

  document.getElementById("searchInputPage").addEventListener("input", function(e){
    searchTerm = e.target.value;
    renderSearch();
    var url = new URL(window.location);
    url.searchParams.set("q", searchTerm);
    window.history.replaceState({}, "", url);
  });

  A.fetchProducts().then(renderSearch).catch(function(err){
    grid.innerHTML = '<div class="error-state"><h3>مشکلی در بارگذاری محصولات پیش آمد</h3><p>' + A.escapeHtml(err.message) + '</p></div>';
  });

  setTimeout(function(){ document.getElementById("searchInputPage").focus(); }, 50);
})();
</script>
</body>
</html>
