<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تکمیل سفارش | AViStore</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="container nav"><a class="logo" href="/">AVi<span>Store</span></a><a class="cart" href="/">بازگشت</a></div></header>
<main class="container"><div class="formbox">
<h1>تکمیل سفارش</h1><div id="checkout-summary"></div>
<form id="checkout-form">
<label>نام و نام خانوادگی</label><input name="name" required>
<label>شماره موبایل</label><input name="phone" inputmode="tel" placeholder="09123456789" required>
<label>کد پستی</label><input name="postal_code" inputmode="numeric">
<label>آدرس کامل</label><textarea name="address" required></textarea>
<button class="btn" type="submit">پرداخت آنلاین</button>
</form></div></main>
<script src="js/config.js"></script><script src="js/checkout.js"></script></body></html>
