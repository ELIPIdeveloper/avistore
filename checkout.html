<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سبد خرید | AViStore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: white;
            border-bottom: 1px solid #eee;
        }

        .header {
            max-width: 1100px;
            margin: auto;
            height: 70px;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: #111;
        }

        .logo span {
            color: #f5a400;
        }

        .back {
            text-decoration: none;
            color: #555;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .cart-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;

            padding: 15px 0;

            border-bottom: 1px solid #eee;
        }

        .cart-item img {
            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 12px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin: 0 0 8px;
        }

        .item-price {
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;

            border: 1px solid #ddd;
            background: white;

            border-radius: 8px;

            cursor: pointer;
        }

        .remove {
            border: none;
            background: #ffe5e5;
            color: #c00;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;
        }

        .summary {
            margin-top: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-top: 20px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
        }

        .pay-button {
            border: none;

            background: #f5a400;
            color: #111;

            padding: 15px 25px;

            border-radius: 12px;

            font-family: inherit;
            font-weight: bold;

            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        @media(max-width: 600px) {

            .cart-item {
                flex-wrap: wrap;
            }

            .summary {
                flex-direction: column;
                gap: 20px;
            }

            .pay-button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

<header>

    <div class="header">

        <a href="index.html"
           class="logo">

            AVi<span>Store</span>

        </a>

        <a href="index.html"
           class="back">

            ← ادامه خرید

        </a>

    </div>

</header>


<main>

    <h1>
        🛒 سبد خرید
    </h1>

    <div class="cart-box">

        <div id="cart">

            در حال بارگذاری...

        </div>

    </div>

</main>


<script>

    const CART_KEY = "avistore_cart";


    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem(CART_KEY)
            ) || [];

        } catch {

            return [];

        }

    }


    function saveCart(cart) {

        localStorage.setItem(
            CART_KEY,
            JSON.stringify(cart)
        );

    }


    function formatPrice(price) {

        return Number(price)
            .toLocaleString("fa-IR")
            + " تومان";

    }


    function renderCart() {

        const container =
            document.getElementById("cart");

        const cart =
            getCart();


        if (!cart.length) {

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        سبد خرید خالی است
                    </h2>

                    <br>

                    <a href="index.html">

                        رفتن به فروشگاه

                    </a>

                </div>

            `;

            return;

        }


        let total = 0;


        container.innerHTML =
            cart.map((item, index) => {

                const quantity =
                    Number(item.quantity) || 1;

                const price =
                    Number(item.price) || 0;


                total +=
                    price * quantity;


                return `

                    <div class="cart-item">


                        <img
                            src="${item.image}"
                            alt="${item.name}"
                        >


                        <div class="item-info">

                            <h3>
                                ${item.name}
                            </h3>

                            <div class="item-price">

                                ${formatPrice(price)}

                            </div>

                        </div>


                        <div class="quantity">

                            <button
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        -1
                                    )
                                "
                            >
                                −
                            </button>


                            <strong>

                                ${quantity}

                            </strong>


                            <button
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        1
                                    )
                                "
                            >
                                +
                            </button>

                        </div>


                        <button
                            class="remove"
                            onclick="
                                removeItem(${index})
                            "
                        >

                            حذف

                        </button>


                    </div>

                `;

            }).join("");


        container.innerHTML += `

            <div class="summary">

                <div>

                    مبلغ کل:

                    <span class="total">

                        ${formatPrice(total)}

                    </span>

                </div>


                <button
                    class="pay-button"
                    onclick="startPayment()"
                >

                    ادامه و پرداخت

                </button>

            </div>

        `;

    }


    function changeQuantity(index, change) {

        const cart =
            getCart();


        if (!cart[index]) return;


        cart[index].quantity =
            Number(cart[index].quantity)
            + change;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart(cart);

        renderCart();

    }


    function removeItem(index) {

        const cart =
            getCart();


        cart.splice(index, 1);


        saveCart(cart);

        renderCart();

    }


    function startPayment() {

        alert(
            "اتصال به درگاه زرین‌پال را در مرحله بعد فعال می‌کنیم."
        );

    }


    renderCart();

</script>

</body>

</html>
