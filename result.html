<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نتیجه سفارش | AviStore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<section class="card center">
  <div id="icon" class="result-icon">...</div>
  <h1 id="title">نتیجه پرداخت</h1>
  <p id="message">در حال بررسی...</p>
  <div id="info"></div>
  <a href="https://avistore.ir" class="home">بازگشت به فروشگاه</a>
</section>
</main>
<script>
const p = new URLSearchParams(location.search);
const success = p.get("status") === "success";
document.getElementById("icon").textContent = success ? "✓" : "×";
document.getElementById("icon").className = "result-icon " + (success ? "success" : "failed");
document.getElementById("title").textContent = success ? "پرداخت موفق بود" : "پرداخت ناموفق بود";
document.getElementById("message").textContent =
  success ? "سفارش شما ثبت و پرداخت آن تأیید شد." : (p.get("message") || "پرداخت انجام نشد.");
document.getElementById("info").innerHTML = `
  <div class="info"><b>شماره سفارش:</b> ${esc(p.get("purchase_id") || "-")}</div>
  ${success ? `<div class="info"><b>کد پیگیری:</b> ${esc(p.get("ref_id") || "-")}</div>` : ""}
`;
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script>
</body>
</html>
