<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نتیجهٔ پرداخت | آوی استور</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F4E86'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23FAF9F5' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css?v=5">
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="/index.html">
      <span class="brand-mark">A</span><span class="brand-text">آوی استور</span>
    </a>
    <a class="icon-btn header-search-btn" href="/search.html" aria-label="جستجو">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </a>
    <a class="icon-btn" href="/cart.html" aria-label="سبد خرید">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span class="cart-badge" hidden>0</span>
    </a>
  </div>
</header>

<div class="app">
  <div class="result-wrap" id="resultWrap">
    <div class="skeleton" style="aspect-ratio:2;border-radius:22px;"></div>
  </div>
</div>

<footer class="app-foot">© <span id="year"></span> آوی استور — تمام حقوق محفوظ است.</footer>

<div class="toast-stack" id="toastStack"></div>

<nav class="bottom-nav">
  <a class="nav-btn" href="/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    خانه
  </a>
  <a class="nav-btn" href="/categories.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    دسته‌ها
  </a>
  <a class="nav-btn" href="/search.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    جستجو
  </a>
  <a class="nav-btn" href="/cart.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
    سبد خرید
    <span class="nav-badge" hidden>0</span>
  </a>
</nav>

<script src="/assets/common.js?v=5"></script>
<script>
(function(){
  "use strict";
  var A = window.AVISTORE;
  document.getElementById("year").textContent = new Date().getFullYear();
  A.initChrome();

  var wrap = document.getElementById("resultWrap");

  function getParams(){
    var p = new URLSearchParams(window.location.search);
    return {
      status: p.get("status") || "",
      purchase_id: p.get("purchase_id") || "",
      ref_id: p.get("ref_id") || "",
      message: p.get("message") || "",
      zarinpal_code: p.get("zarinpal_code") || ""
    };
  }

  var q = getParams();
  var isSuccess = q.status === "success";

  var order = q.purchase_id ? A.getOrder(q.purchase_id) : null;

  if(isSuccess){
    // سفارش محلی را «پرداخت‌شده» علامت می‌زنیم و سبد خرید را خالی می‌کنیم.
    if(order){
      order = A.updateOrder(q.purchase_id, {
        status: "paid",
        ref_id: q.ref_id || order.ref_id || null,
        paid_at: new Date().toISOString()
      });
    } else if(q.purchase_id){
      order = {
        purchase_id: q.purchase_id,
        amount: null,
        status: "paid",
        ref_id: q.ref_id || null,
        customer: {},
        items: [],
        created_at: new Date().toISOString(),
        paid_at: new Date().toISOString()
      };
    }
    A.clearCart();
  } else {
    if(order){
      order = A.updateOrder(q.purchase_id, { status: "failed" });
    }
  }

  function render(){
    if(isSuccess){
      wrap.innerHTML =
        '<div class="result-icon ok">' +
          '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>' +
        '</div>' +
        '<h2>پرداخت با موفقیت انجام شد</h2>' +
        '<p>سفارش شما ثبت شد و به‌زودی برای ارسال آماده می‌شود.</p>' +
        '<div class="result-meta">' +
          '<div><span>شماره سفارش</span><b class="num">' + A.escapeHtml(q.purchase_id || "-") + '</b></div>' +
          (q.ref_id ? '<div><span>کد رهگیری</span><b class="num">' + A.escapeHtml(q.ref_id) + '</b></div>' : "") +
          (order && order.amount != null ? '<div><span>مبلغ پرداخت‌شده</span><b class="num">' + A.fmtPrice(order.amount) + '</b></div>' : "") +
        '</div>' +
        '<div class="result-actions">' +
          '<button type="button" class="checkout-btn" id="printBtn">چاپ فاکتور</button>' +
          '<a href="/index.html" class="back-link" style="justify-content:center;">بازگشت به فروشگاه</a>' +
        '</div>';
    } else {
      wrap.innerHTML =
        '<div class="result-icon bad">' +
          '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
        '</div>' +
        '<h2>پرداخت ناموفق بود</h2>' +
        '<p>' + A.escapeHtml(q.message || "پرداخت انجام نشد یا لغو شد. می‌توانید دوباره تلاش کنید.") + '</p>' +
        (q.purchase_id ? (
          '<div class="result-meta"><div><span>شماره سفارش</span><b class="num">' + A.escapeHtml(q.purchase_id) + '</b></div></div>'
        ) : "") +
        '<div class="result-actions">' +
          '<a href="/cart.html" class="checkout-btn" style="display:block;text-align:center;text-decoration:none;">بازگشت به سبد خرید</a>' +
        '</div>';
    }

    var printBtn = document.getElementById("printBtn");
    if(printBtn){
      printBtn.addEventListener("click", function(){ A.printInvoice(order); });
    }
  }

  render();
})();
</script>
</body>
</html>
