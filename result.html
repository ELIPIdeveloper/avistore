<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>نتیجه پرداخت | AviStore</title> <link rel="stylesheet" href="style.css"> </head> <body> <div class="container"> <div class="payment-card"> <div id="icon" class="result-icon" > ... </div> <h1 id="title"> در حال بررسی پرداخت </h1> <p id="message"> لطفاً صبر کنید... </p> <div id="info"></div> <a href="https://avistore.ir" class="home-button" > بازگشت به فروشگاه </a> </div> </div> <script> const params = new URLSearchParams( window.location.search ); const status = params.get("status"); const purchaseId = params.get("purchase_id"); const refId = params.get("ref_id"); const error = params.get("message"); const icon = document.getElementById("icon"); const title = document.getElementById("title"); const message = document.getElementById("message"); const info = document.getElementById("info"); function escapeHtml(value) { return String(value) .replaceAll("&", "&amp;") .replaceAll("<", "&lt;") .replaceAll(">", "&gt;") .replaceAll('"', "&quot;") .replaceAll("'", "&#039;"); } if (status === "success") { icon.textContent = "✓"; icon.className = "result-icon success"; title.textContent = "پرداخت موفق بود"; message.textContent = "پرداخت شما با موفقیت تأیید شد."; info.innerHTML = ` <div class="info"> <strong> شناسه خرید: </strong> ${escapeHtml( purchaseId || "-" )} </div> <div class="info"> <strong> کد پیگیری: </strong> ${escapeHtml( refId || "-" )} </div> `; } else { icon.textContent = "×"; icon.className = "result-icon failed"; title.textContent = "پرداخت ناموفق بود"; message.textContent = error || "پرداخت انجام نشد یا لغو شد."; info.innerHTML = ` <div class="info"> <strong> شناسه خرید: </strong> ${escapeHtml( purchaseId || "-" )} </div> `; } </script> </body> </html>
