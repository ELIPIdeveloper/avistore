<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>پنل سفارش‌ها | آوی استور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/style.css?v=5">
<style>
  body{background:var(--bg);}
  .admin-wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px;}
  .admin-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .admin-head h1{font-size:19px;font-weight:800;margin:0;}
  .admin-toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;
  }
  .admin-field{display:flex;flex-direction:column;gap:5px;}
  .admin-field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .admin-field input, .admin-field select{
    padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);
    font-size:13.5px;background:var(--bg);color:var(--ink);outline:none;font-family:inherit;
  }
  .admin-field input:focus, .admin-field select:focus{border-color:var(--accent);background:var(--surface);}
  .admin-field input[type="password"]{min-width:200px;}
  .admin-btn{
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;transition:background .15s;
  }
  .admin-btn:hover{background:var(--accent-dark);}
  .admin-btn.secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
  .admin-btn.secondary:hover{background:var(--accent-tint);}
  .admin-status{font-size:12.5px;color:var(--ink-faint);margin-bottom:12px;min-height:16px;}
  .admin-status.err{color:var(--danger);font-weight:700;}
  .admin-summary{
    display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;
  }
  .summary-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;min-width:130px;
  }
  .summary-card .n{font-size:19px;font-weight:900;color:var(--accent-dark);}
  .summary-card .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .orders-table-wrap{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow-x:auto;
  }
  table.orders-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:920px;}
  table.orders-table th{
    background:var(--accent-tint);color:var(--accent-dark);font-weight:800;
    text-align:right;padding:10px 10px;white-space:nowrap;position:sticky;top:0;
  }
  table.orders-table td{padding:10px 10px;border-top:1px dashed var(--line);vertical-align:top;}
  table.orders-table tr:hover td{background:var(--accent-tint);}
  .cust-name{font-weight:700;}
  .cust-phone{color:var(--ink-soft);font-size:11.5px;direction:ltr;text-align:right;}
  .addr-line{line-height:1.7;}
  .item-line{white-space:nowrap;}
  .item-line + .item-line{margin-top:4px;}
  .badge{
    display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  }
  .badge.paid{background:#e4f5ea;color:#1f8a4c;}
  .badge.pending{background:#fff4e0;color:#a8660e;}
  .badge.cancelled{background:#f1f1f1;color:#6b6b6b;}
  .badge.failed{background:#fdeaea;color:#c0392b;}
  .badge.other{background:var(--accent-tint);color:var(--accent-dark);}
  .amount-cell{font-weight:800;white-space:nowrap;}
  .empty-row td{text-align:center;padding:40px 10px;color:var(--ink-faint);}
  code.small{font-size:11px;color:var(--ink-faint);}
</style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-head">
    <h1>پنل سفارش‌ها — آوی استور</h1>
    <a href="/index.html" style="font-size:12.5px;color:var(--accent);font-weight:700;">بازگشت به سایت</a>
  </div>

  <div class="admin-toolbar">
    <div class="admin-field">
      <label>کلید ادمین</label>
      <input type="password" id="adminKey" placeholder="ADMIN_KEY" autocomplete="off">
    </div>
    <div class="admin-field">
      <label>وضعیت سفارش</label>
      <select id="statusSelect">
        <option value="paid">پرداخت‌شده</option>
        <option value="pending">در انتظار پرداخت</option>
        <option value="cancelled">لغوشده</option>
        <option value="failed">ناموفق</option>
        <option value="all">همه</option>
      </select>
    </div>
    <div class="admin-field">
      <label>سقف تعداد</label>
      <input type="number" id="limitInput" value="200" min="1" max="500" style="width:90px;">
    </div>
    <button class="admin-btn" id="loadBtn" type="button">بارگذاری سفارش‌ها</button>
    <button class="admin-btn secondary" id="csvBtn" type="button">دانلود CSV</button>
  </div>

  <div class="admin-status" id="statusMsg"></div>

  <div class="admin-summary" id="summaryRow" hidden>
    <div class="summary-card"><div class="n" id="sumCount">0</div><div class="l">تعداد سفارش</div></div>
    <div class="summary-card"><div class="n num" id="sumTotal">0</div><div class="l">جمع کل مبلغ</div></div>
  </div>

  <div class="orders-table-wrap">
    <table class="orders-table">
      <thead>
        <tr>
          <th>کد سفارش / تاریخ</th>
          <th>مشتری</th>
          <th>آدرس</th>
          <th>اقلام خریداری‌شده</th>
          <th>مبلغ</th>
          <th>وضعیت</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr class="empty-row"><td colspan="6">کلید ادمین را وارد کنید و «بارگذاری سفارش‌ها» را بزنید.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/assets/admin.js?v=1"></script>
</body>
</html>
